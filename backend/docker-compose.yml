name: titanic-chatbot

services:
  backend:
    container_name: titanic-backend
    build: .
    ports:
      - "8900:8000"
    volumes:
      - .:/app # Bind mount for hot reload
      - data_vol:/data
      - log_vol:/logs
      - hist_vol:/history
    extra_hosts:                              
      - "host.docker.internal:host-gateway"   
    env_file:
      - .env

volumes:
  data_vol:
  log_vol:
  hist_vol:
